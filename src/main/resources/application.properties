# Habilitar logs de seguridad y controladores
logging.level.org.springframework.security=DEBUG
logging.level.com.example.nom035.controller=DEBUG

# Escribir logs a archivo (rotación básica manejada por Logback por defecto)
logging.file.name=backend.log

spring.datasource.url=jdbc:mysql://mysql:3306/nom035?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=change_me_root_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080
spring.sql.init.mode=always

# Carpeta base para subir documentos de Medica LEBEN (ruta en el servidor)
# Puede ser relativa al directorio de ejecución o absoluta
medica.leben.upload.base-path=uploads/medica-leben