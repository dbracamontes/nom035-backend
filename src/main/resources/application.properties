# Habilitar logs de seguridad y controladores
logging.level.org.springframework.security=DEBUG
logging.level.com.example.nom035.controller=DEBUG

# Escribir logs a archivo (rotaciÃ³n bÃ¡sica manejada por Logback por defecto)
logging.file.name=backend.log

spring.datasource.url=jdbc:mysql://localhost:3307/nom035?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=nom035user
spring.datasource.password=nom035pass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Carpeta base para subir documentos de Medica LEBEN (ruta en el servidor)
# Usar variable de entorno MEDICA_LEBEN_UPLOAD_BASE_PATH cuando esté definida,
# con valor por defecto /uploads/medica-leben (coincide con docker-compose).
medica.leben.upload.base-path=${MEDICA_LEBEN_UPLOAD_BASE_PATH:/uploads/medica-leben}

app.employee-docs.upload-base-path=uploads/employees
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

# --- Ajustes de desarrollo para evitar timeouts ---
# Aumenta el timeout de las peticiones HTTP (desarrollo)
server.servlet.session.timeout=60m
spring.mvc.async.request-timeout=600000
spring.web.servlet.multipart.resolve-lazily=true
spring.task.execution.timeout=600s
spring.datasource.hikari.connection-timeout=60000

# --- Interpretación de documentos (OCR + OpenAI) ---
docai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
docai.ocr.provider=${OCR_PROVIDER:local}
docai.max-pages=${DOC_AI_MAX_PAGES:30}
docai.max-file-size-mb=${DOC_AI_MAX_FILE_MB:30}
docai.storage-base-path=${DOC_AI_STORAGE_BASE_PATH:uploads/doc-generator/tmp}

docgen.templates-base-path=${DOCGEN_TEMPLATES_BASE_PATH:Genera Documento}
docgen.scripts-base-path=${DOCGEN_SCRIPTS_BASE_PATH:Genera Documento}