# Habilitar logs de seguridad y controladores
logging.level.org.springframework.security=DEBUG
logging.level.com.example.nom035.controller=DEBUG

# Escribir logs a archivo (rotaciÃ³n bÃ¡sica manejada por Logback por defecto)
logging.file.name=backend.log

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/nom035?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_ROOT_PASSWORD:your_mysql_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8080
spring.sql.init.mode=always

# Carpeta base para subir documentos de Medica LEBEN (ruta en el servidor)
# Usar variable de entorno MEDICA_LEBEN_UPLOAD_BASE_PATH cuando esté definida,
# con valor por defecto /uploads/medica-leben (coincide con docker-compose).
medica.leben.upload.base-path=${MEDICA_LEBEN_UPLOAD_BASE_PATH:/uploads/medica-leben}

app.employee-docs.upload-base-path=uploads/employees
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB