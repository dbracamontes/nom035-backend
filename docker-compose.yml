services:
  mysql:
    image: mysql:8.0
    container_name: nom035-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nom035}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-your_mysql_password}
      MYSQL_USER: ${MYSQL_USER:-nom035user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-nom035pass}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nom035-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-nom035}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-${MYSQL_USER:-nom035user}}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${MYSQL_PASSWORD:-nom035pass}}
      DOCGEN_TEMPLATES_BASE_PATH: /app/templates/docgen
      DOCGEN_SCRIPTS_BASE_PATH: /app/Genera Documento
      MEDICA_LEBEN_UPLOAD_BASE_PATH: /uploads/medica-leben
      # 0 means no page limit: process all pages from each document
      DOC_AI_MAX_PAGES: 0
      DOC_AI_SIMULATE_DELAY_MS: 0
      DOC_AI_MAX_FILE_MB: 30
      DOC_AI_STORAGE_BASE_PATH: /uploads/doc-generator/tmp
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./src/main/resources/templates/docgen:/app/templates/docgen
      - './Genera Documento:/app/Genera Documento'
      - ./uploads/medica-leben:/uploads/medica-leben
      - ./uploads/doc-generator/tmp:/uploads/doc-generator/tmp

volumes:
  db_data: